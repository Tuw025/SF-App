services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: sf_admin
      POSTGRES_PASSWORD: sf_password123
      POSTGRES_DB: sf_db
    ports:
      - "5433:5432"
    volumes:
      - sf_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - sf_redisdata:/data

volumes:
  sf_pgdata:
  sf_redisdata:
